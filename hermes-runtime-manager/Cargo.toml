[package]
name = "hermes-runtime-manager"
version = "0.1.0"
description = "Cross-platform lifecycle authority for Hermes Managed Runtime"
authors = ["Hermes contributors"]
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "hermes_runtime_manager"
path = "src/lib.rs"

[[bin]]
name = "hermes-runtime-manager"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
