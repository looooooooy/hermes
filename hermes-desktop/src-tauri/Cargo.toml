[package]
name = "hermes-desktop"
version = "0.1.0"
description = "Hermes Managed Runtime desktop shell"
authors = ["Hermes contributors"]
edition = "2021"

[lib]
name = "hermes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hermes-runtime-manager = { path = "../../hermes-runtime-manager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
