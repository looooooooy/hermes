# Include this file inside the existing HTTPS server block.
# It deliberately contains no http{}, server{}, listen, certificate, or global log setup.

# Business REST API. The public /hermes/ prefix is retained and stripped upstream.
location /hermes/api/ {
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /hermes;
    proxy_pass http://127.0.0.1:8101/api/;
}

# Authentication endpoints intentionally live outside /api upstream.
location /hermes/auth/ {
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /hermes;
    proxy_pass http://127.0.0.1:8101/auth/;
}

# Client-facing API WebSocket. Access logging is disabled to avoid query ticket leakage.
location = /hermes/api/ws {
    access_log off;
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /hermes;
    proxy_set_header Upgrade "$http_upgrade";
    proxy_set_header Connection "upgrade";
    proxy_pass http://127.0.0.1:8101/api/ws;
}

# Internal Connector Protocol WSS. Keep this path out of the general REST route.
location = /hermes/internal/connector/ws {
    access_log off;
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /hermes;
    proxy_set_header Upgrade "$http_upgrade";
    proxy_set_header Connection "upgrade";
    proxy_pass http://127.0.0.1:8102/api/ws;
}

# File API uses a separate process and bounded but larger request bodies.
location /hermes/files/ {
    client_max_body_size 256m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /hermes;
    proxy_pass http://127.0.0.1:8104/;
}

# Public health aliases remain explicit so no catch-all proxy is introduced.
location = /hermes/live {
    access_log off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
    proxy_pass http://127.0.0.1:8101/live;
}

location = /hermes/ready {
    access_log off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
    proxy_pass http://127.0.0.1:8101/ready;
}
