name: Hermes Windows Product Settings

on:
  push:
    branches:
      - "feature/hermes-windows-formal-composition-*"
    paths:
      - "hermes-connector/src/hermes_connector/bootstrap/settings.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/private_state.py"
      - "hermes-connector/tests/unit/bootstrap/test_runtime_settings.py"
      - "hermes-connector/tests/platform/windows/test_runtime_settings.py"
      - ".github/workflows/hermes-windows-product-settings.yml"
  pull_request:
    paths:
      - "hermes-connector/src/hermes_connector/bootstrap/settings.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/private_state.py"
      - "hermes-connector/tests/unit/bootstrap/test_runtime_settings.py"
      - "hermes-connector/tests/platform/windows/test_runtime_settings.py"
      - ".github/workflows/hermes-windows-product-settings.yml"

permissions:
  contents: read

concurrency:
  group: hermes-windows-product-settings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  existing-settings:
    name: Existing runtime settings compatibility / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Connector test dependencies
        run: >-
          python -m pip install
          -e hermes-connector
          pytest
          pytest-asyncio
          ruff==0.16.1
      - name: Lint settings slice
        run: >-
          ruff check
          hermes-connector/src/hermes_connector/bootstrap/settings.py
          hermes-connector/tests/platform/windows/test_runtime_settings.py
      - name: Regress existing macOS/POSIX settings behavior
        run: >-
          python -m pytest -vv
          hermes-connector/tests/unit/bootstrap/test_runtime_settings.py

  windows-settings:
    name: Windows runtime settings / windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Connector test dependencies
        run: >-
          python -m pip install
          -e hermes-connector
          pytest
      - name: Verify Windows defaults, DPAPI policy, and private config
        run: >-
          python -m pytest -vv
          hermes-connector/tests/platform/windows/test_runtime_settings.py
