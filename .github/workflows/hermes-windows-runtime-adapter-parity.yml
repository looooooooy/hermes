name: Hermes Windows Runtime Adapter Parity

on:
  push:
    branches:
      - "feature/hermes-windows-runtime-adapter-parity-*"
    paths:
      - "hermes-connector/src/hermes_connector/adapters/secure_store_cloud_token.py"
      - "hermes-connector/src/hermes_connector/adapters/foundation_projection.py"
      - "hermes-connector/src/hermes_connector/adapters/local_runtime_preflight.py"
      - "hermes-connector/src/hermes_connector/adapters/control_response.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/macos/credentials.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/macos/foundation_projection.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/macos/local_runtime_preflight.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/**"
      - "hermes-connector/tests/unit/adapters/test_secure_store_cloud_token.py"
      - "hermes-connector/tests/platform/macos/test_plugin_owner_control_channel.py"
      - "hermes-connector/tests/platform/windows/test_runtime_adapter_parity.py"
      - "hermes-connector/tests/platform/test_platform_boundaries.py"
      - ".github/workflows/hermes-windows-runtime-adapter-parity.yml"
  pull_request:
    paths:
      - "hermes-connector/src/hermes_connector/adapters/secure_store_cloud_token.py"
      - "hermes-connector/src/hermes_connector/adapters/foundation_projection.py"
      - "hermes-connector/src/hermes_connector/adapters/local_runtime_preflight.py"
      - "hermes-connector/src/hermes_connector/adapters/control_response.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/macos/credentials.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/macos/foundation_projection.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/macos/local_runtime_preflight.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/**"
      - "hermes-connector/tests/unit/adapters/test_secure_store_cloud_token.py"
      - "hermes-connector/tests/platform/macos/test_plugin_owner_control_channel.py"
      - "hermes-connector/tests/platform/windows/test_runtime_adapter_parity.py"
      - "hermes-connector/tests/platform/test_platform_boundaries.py"
      - ".github/workflows/hermes-windows-runtime-adapter-parity.yml"

permissions:
  contents: read

concurrency:
  group: hermes-windows-runtime-adapter-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-contract:
    name: Shared runtime adapter contract / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          -e hermes-connector
          pytest
          pytest-asyncio
          ruff==0.16.1
      - name: Lint runtime adapter parity slice
        run: >-
          ruff check
          hermes-connector/src/hermes_connector/adapters/secure_store_cloud_token.py
          hermes-connector/src/hermes_connector/adapters/foundation_projection.py
          hermes-connector/src/hermes_connector/adapters/local_runtime_preflight.py
          hermes-connector/src/hermes_connector/adapters/control_response.py
          hermes-connector/src/hermes_connector/adapters/platform/macos/credentials.py
          hermes-connector/src/hermes_connector/adapters/platform/macos/foundation_projection.py
          hermes-connector/src/hermes_connector/adapters/platform/macos/local_runtime_preflight.py
          hermes-connector/src/hermes_connector/adapters/platform/windows/control_client.py
          hermes-connector/src/hermes_connector/adapters/platform/windows/pairing_command_lock.py
          hermes-connector/src/hermes_connector/adapters/platform/windows/plugin_control_relay.py
          hermes-connector/tests/unit/adapters/test_secure_store_cloud_token.py
          hermes-connector/tests/platform/windows/test_runtime_adapter_parity.py
      - name: Test shared secure-store Cloud token contract
        run: >-
          python -m pytest -vv
          hermes-connector/tests/unit/adapters/test_secure_store_cloud_token.py
      - name: Preserve platform boundaries
        run: >-
          python -m pytest -vv
          hermes-connector/tests/platform/test_platform_boundaries.py

  macos-compat:
    name: macOS runtime adapter compatibility / macos-latest
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          -e hermes-connector
          pytest
          pytest-asyncio
      - name: Regress macOS Owner Control channel
        run: >-
          python -m pytest -vv
          hermes-connector/tests/platform/macos/test_plugin_owner_control_channel.py

  windows-runtime-adapters:
    name: Windows runtime adapter parity / windows-latest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Plugin and Connector dependencies
        run: >-
          python -m pip install
          -e hermes-agent-plugin
          -e hermes-connector
          pytest
          pytest-asyncio
          pytest-timeout
      - name: Regress Secure State foundation
        run: >-
          python -m pytest -vv
          --timeout=45 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_secure_state_foundation.py
      - name: Regress DPAPI device identity
        run: >-
          python -m pytest -vv
          --timeout=45 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_device_identity_dpapi.py
      - name: Regress state projections and readiness receipt
        run: >-
          python -m pytest -vv
          --timeout=45 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_state_projections.py
          hermes-connector/tests/platform/windows/test_status_receipt.py
      - name: Test formal runtime adapter parity
        run: >-
          python -m pytest -vv
          --timeout=45 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_runtime_adapter_parity.py
      - name: Regress Control client foundation
        run: >-
          python -m pytest -vv
          --timeout=45 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_control_client_foundation.py
