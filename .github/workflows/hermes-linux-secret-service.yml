name: Hermes Linux Secret Service

on:
  push:
    branches:
      - "feature/hermes-desktop-foundation-*"
    paths:
      - "hermes-runtime-manager/**"
      - ".github/workflows/hermes-linux-secret-service.yml"
  pull_request:
    paths:
      - "hermes-runtime-manager/**"
      - ".github/workflows/hermes-linux-secret-service.yml"

permissions:
  contents: read

concurrency:
  group: hermes-linux-secret-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-service:
    name: Ubuntu 24.04 Secret Service
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: rustup default stable
      - name: Install GNOME Secret Service provider
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      - name: Check Linux SecretStore contract
        run: >-
          cargo test --manifest-path hermes-runtime-manager/Cargo.toml
          linux_secret_service::tests --lib
      - name: Prove binary secret round-trip against real GNOME Keyring
        shell: bash
        run: |
          set -euo pipefail
          secret_root="${RUNNER_TEMP}/hermes-secret-service"
          rm -rf "$secret_root"
          mkdir -p "$secret_root/data" "$secret_root/config"
          export HERMES_SECRET_TEST_ROOT="$secret_root"
          dbus-run-session -- bash --noprofile --norc -euo pipefail -c '
            export XDG_DATA_HOME="$HERMES_SECRET_TEST_ROOT/data"
            export XDG_CONFIG_HOME="$HERMES_SECRET_TEST_ROOT/config"
            login_env="$(printf "hermes-ci-keyring\n" | gnome-keyring-daemon --login)"
            eval "$login_env"
            start_env="$(gnome-keyring-daemon --start --components=secrets)"
            eval "$start_env"
            cargo test --manifest-path hermes-runtime-manager/Cargo.toml \
              --test linux_secret_service -- --ignored --nocapture
          '
