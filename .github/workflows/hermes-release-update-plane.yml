name: Hermes Release Update Plane

on:
  push:
    branches:
      - "feature/hermes-release-update-plane-*"
    paths:
      - "hermes-runtime-manager/src/release_control.rs"
      - "hermes-runtime-manager/src/lib.rs"
      - "hermes-runtime-manager/src/main.rs"
      - "hermes-release-publisher/**"
      - ".github/workflows/hermes-release-update-plane.yml"
  pull_request:
    paths:
      - "hermes-runtime-manager/src/release_control.rs"
      - "hermes-runtime-manager/src/lib.rs"
      - "hermes-runtime-manager/src/main.rs"
      - "hermes-release-publisher/**"
      - ".github/workflows/hermes-release-update-plane.yml"

permissions:
  contents: read

concurrency:
  group: hermes-release-update-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-control:
    name: Signed release control / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: rustup default stable
      - name: Test Release / Channel / Block signature and anti-rollback contracts
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml release_control::tests
      - name: Compile Runtime Manager verification CLI
        run: cargo check --manifest-path hermes-runtime-manager/Cargo.toml --bin hermes-runtime-manager
      - name: Verify CLI surface is present
        run: cargo run --quiet --manifest-path hermes-runtime-manager/Cargo.toml -- version

  oss-publisher:
    name: Alibaba OSS immutable publisher contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned OSS SDK V2 and publisher tests
        run: python -m pip install --disable-pip-version-check -e "./hermes-release-publisher[dev]"
      - name: Test immutable artifacts, monotonic control pointers, and SDK request surface
        run: python -m pytest -q hermes-release-publisher/tests
      - name: Exercise content-addressed publication planning CLI
        run: hermes-release-publisher plan-artifact hermes-release-publisher/pyproject.toml --namespace evidence
