name: Hermes Release Update Plane

on:
  push:
    branches:
      - "feature/hermes-release-update-plane-*"
    paths:
      - "hermes-runtime-manager/Cargo.toml"
      - "hermes-runtime-manager/src/release_control.rs"
      - "hermes-runtime-manager/src/update_download.rs"
      - "hermes-runtime-manager/src/update_http.rs"
      - "hermes-runtime-manager/src/update_coordinator.rs"
      - "hermes-runtime-manager/src/update_adapters.rs"
      - "hermes-runtime-manager/src/update_connector_lane.rs"
      - "hermes-runtime-manager/src/managed_payload_archive.rs"
      - "hermes-runtime-manager/src/managed_release_stager.rs"
      - "hermes-runtime-manager/src/manager.rs"
      - "hermes-runtime-manager/src/lib.rs"
      - "hermes-runtime-manager/src/main.rs"
      - "hermes-release-publisher/**"
      - "hermes-cloud/src/hermes_cloud/modules/release_update/**"
      - "hermes-cloud/src/hermes_cloud/modules/cloud_api/adapters/fastapi.py"
      - "hermes-cloud/tests/release_update/**"
      - "hermes-cloud/tests/migration/platform/postgres/test_architecture.py"
      - ".github/workflows/hermes-release-update-plane.yml"
  pull_request:
    paths:
      - "hermes-runtime-manager/Cargo.toml"
      - "hermes-runtime-manager/src/release_control.rs"
      - "hermes-runtime-manager/src/update_download.rs"
      - "hermes-runtime-manager/src/update_http.rs"
      - "hermes-runtime-manager/src/update_coordinator.rs"
      - "hermes-runtime-manager/src/update_adapters.rs"
      - "hermes-runtime-manager/src/update_connector_lane.rs"
      - "hermes-runtime-manager/src/managed_payload_archive.rs"
      - "hermes-runtime-manager/src/managed_release_stager.rs"
      - "hermes-runtime-manager/src/manager.rs"
      - "hermes-runtime-manager/src/lib.rs"
      - "hermes-runtime-manager/src/main.rs"
      - "hermes-release-publisher/**"
      - "hermes-cloud/src/hermes_cloud/modules/release_update/**"
      - "hermes-cloud/src/hermes_cloud/modules/cloud_api/adapters/fastapi.py"
      - "hermes-cloud/tests/release_update/**"
      - "hermes-cloud/tests/migration/platform/postgres/test_architecture.py"
      - ".github/workflows/hermes-release-update-plane.yml"

permissions:
  contents: read

concurrency:
  group: hermes-release-update-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-control:
    name: Signed release control / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: rustup default stable
      - name: Test Release / Channel / Block signature and anti-rollback contracts
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml release_control::tests
      - name: Test resumable signed-artifact download contracts
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml update_download::tests
      - name: Test strict HTTPS Range grant and transport contracts
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml update_http::tests
      - name: Test deterministic tar.zst packing and safe extraction contracts
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml managed_payload_archive::tests
      - name: Test private-python Managed Release staging preconditions
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml managed_release_stager::tests
      - name: Test transactional update coordinator, safe-window, rollback, and recovery contracts
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml update_coordinator::tests
      - name: Test concrete HTTPS fetcher, exact-release activation, health, and rollback adapters
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml update_adapters::tests
      - name: Test graceful Connector drain and active-release reconciliation
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml update_connector_lane::tests
      - name: Compile Runtime Manager verification CLI
        run: cargo check --manifest-path hermes-runtime-manager/Cargo.toml --bin hermes-runtime-manager
      - name: Verify CLI surface is present
        run: cargo run --quiet --manifest-path hermes-runtime-manager/Cargo.toml -- version

  cloud-update-policy:
    name: Cloud signed catalog + rollout policy + HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Cloud update test dependencies
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" "fastapi>=0.127,<1" "httpx>=0.28,<1" "PyJWT[crypto]>=2.8,<3" "argon2-cffi>=23.1,<26" "sqlalchemy>=2,<3" "cryptography>=46,<51"
      - name: Test signed catalog, rollout policy, grants, authenticated HTTP contract, and architecture guard
        env:
          PYTHONPATH: hermes-cloud/src
        run: >-
          python -m pytest -q
          hermes-cloud/tests/release_update/test_signed_catalog.py
          hermes-cloud/tests/release_update/test_update_check_service.py
          hermes-cloud/tests/release_update/test_download_grants.py
          hermes-cloud/tests/release_update/test_update_check_http.py
          hermes-cloud/tests/migration/platform/postgres/test_architecture.py::test_business_and_database_adapter_code_cannot_use_raw_sql_escape_hatches

  oss-publisher:
    name: Alibaba OSS immutable publisher contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned OSS SDK V2 and publisher tests
        run: python -m pip install --disable-pip-version-check -e "./hermes-release-publisher[dev]"
      - name: Test immutable artifacts, monotonic control pointers, signer, presigner, and SDK request surface
        run: python -m pytest -q hermes-release-publisher/tests
      - name: Exercise content-addressed publication planning CLI
        run: hermes-release-publisher plan-artifact hermes-release-publisher/pyproject.toml --namespace evidence

  signer-interoperability:
    name: Python signer → Rust verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Use stable Rust
        run: rustup default stable
      - name: Install release signer
        run: python -m pip install --disable-pip-version-check -e ./hermes-release-publisher
      - name: Generate ephemeral Python-signed release control fixture
        run: >-
          python hermes-release-publisher/tests/generate_cross_language_fixture.py
          --output "${{ runner.temp }}/release-control-fixture"
      - name: Verify Python signatures and update eligibility with Rust Runtime Manager
        run: >-
          cargo run --quiet --manifest-path hermes-runtime-manager/Cargo.toml --
          verify-release-control
          "${{ runner.temp }}/release-control-fixture/release-envelope.json"
          "${{ runner.temp }}/release-control-fixture/channel-envelope.json"
          "${{ runner.temp }}/release-control-fixture/block-envelope.json"
          "${{ runner.temp }}/release-control-fixture/release-trust-store.json"
          "${{ runner.temp }}/release-control-fixture/observed-state.json"