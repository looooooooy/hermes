name: Hermes Cloud pending pairing recovery

on:
  push:
    branches: [main]
    paths:
      - "hermes-cloud/src/hermes_cloud/platform/sqlalchemy/repositories/recoverable_device.py"
      - "hermes-cloud/tests/platform/sqlite/test_device_pairing_abandoned_pending_recovery.py"
      - ".github/workflows/hermes-cloud-pending-pairing-recovery.yml"
  pull_request:
    paths:
      - "hermes-cloud/src/hermes_cloud/platform/sqlalchemy/repositories/recoverable_device.py"
      - "hermes-cloud/tests/platform/sqlite/test_device_pairing_abandoned_pending_recovery.py"
      - ".github/workflows/hermes-cloud-pending-pairing-recovery.yml"

permissions:
  contents: read

jobs:
  pending-pairing-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked Cloud environment
        run: |
          python -m pip install uv==0.12.0
          cd hermes-cloud
          uv sync --locked
      - name: Lint pending pairing recovery
        run: |
          cd hermes-cloud
          uv run --locked ruff check \
            src/hermes_cloud/platform/sqlalchemy/repositories/recoverable_device.py \
            tests/platform/sqlite/test_device_pairing_abandoned_pending_recovery.py
      - name: Test abandoned pending pairing recovery
        run: |
          cd hermes-cloud
          uv run --locked pytest -q \
            tests/platform/sqlite/test_device_pairing_abandoned_pending_recovery.py
