name: Hermes Windows Service Projection

on:
  push:
    branches:
      - "feature/hermes-windows-service-projection-*"
    paths:
      - "hermes-runtime-manager/src/windows_service_manager.rs"
      - "hermes-runtime-manager/src/manager_state.rs"
      - "hermes-runtime-manager/src/lib.rs"
      - "hermes-runtime-manager/src/main.rs"
      - "hermes-runtime-manager/src/manager.rs"
      - "hermes-runtime-manager/src/update_adapters.rs"
      - "hermes-runtime-manager/src/update_connector_lane.rs"
      - ".github/workflows/hermes-windows-service-projection.yml"
  pull_request:
    paths:
      - "hermes-runtime-manager/src/windows_service_manager.rs"
      - "hermes-runtime-manager/src/manager_state.rs"
      - "hermes-runtime-manager/src/lib.rs"
      - "hermes-runtime-manager/src/main.rs"
      - "hermes-runtime-manager/src/manager.rs"
      - "hermes-runtime-manager/src/update_adapters.rs"
      - "hermes-runtime-manager/src/update_connector_lane.rs"
      - ".github/workflows/hermes-windows-service-projection.yml"

permissions:
  contents: read

concurrency:
  group: hermes-windows-service-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Projection persistence regression / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Check Runtime Manager
        run: cargo check --manifest-path hermes-runtime-manager/Cargo.toml
      - name: Verify persistent state contract
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml manager_state::tests -- --nocapture
      - name: Verify Runtime Manager reboot identity semantics
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml manager::tests -- --nocapture

  windows:
    name: Real Windows projection and reboot identity / windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Compile Runtime Manager
        run: cargo check --manifest-path hermes-runtime-manager/Cargo.toml
      - name: Run real Windows service projection tests
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml windows_service_manager -- --nocapture
      - name: Verify Windows persistent state atomic replacement
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml manager_state::tests -- --nocapture
      - name: Verify Windows Runtime Manager reboot identity semantics
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml manager::tests -- --nocapture
      - name: Regress generic release activator serially
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml update_adapters::tests -- --nocapture --test-threads=1
      - name: Regress Connector drain and reconcile lane
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml update_connector_lane::tests -- --nocapture
