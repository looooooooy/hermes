name: Hermes Windows ServiceRunner Checkpoint

on:
  push:
    branches:
      - "feature/hermes-windows-formal-composition-*"
    paths:
      - "hermes-connector/tests/platform/windows/test_formal_service_runner_checkpoint.py"
      - ".github/workflows/hermes-windows-service-runner-checkpoint.yml"
  pull_request:
    paths:
      - "hermes-connector/tests/platform/windows/test_formal_service_runner_checkpoint.py"
      - ".github/workflows/hermes-windows-service-runner-checkpoint.yml"

permissions:
  contents: read

jobs:
  windows-service-runner:
    name: Windows ServiceRunner checkpoint / windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Plugin and Connector dependencies
        run: >-
          python -m pip install
          -e hermes-agent-plugin
          -e hermes-connector
          pytest
          pytest-asyncio
          pytest-timeout
      - name: Verify explicit Windows instance-lock factory
        run: >-
          python -m pytest -vv
          --timeout=45 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_formal_service_runner_checkpoint.py::test_windows_instance_lock_is_a_valid_explicit_service_runner_factory
      - name: Verify formal build reaches ServiceRunner
        if: always()
        run: >-
          python -m pytest -vv
          --timeout=60 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_formal_service_runner_checkpoint.py::test_formal_build_reaches_service_runner_when_runner_is_sentinel
