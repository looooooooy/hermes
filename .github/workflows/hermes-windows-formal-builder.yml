name: Hermes Windows Formal Builder

on:
  push:
    branches:
      - "feature/hermes-windows-formal-composition-*"
    paths:
      - "hermes-connector/src/hermes_connector/bootstrap/windows_formal_runtime.py"
      - "hermes-connector/src/hermes_connector/bootstrap/windows_service.py"
      - "hermes-connector/tests/platform/windows/test_windows_formal_runtime_builder.py"
      - ".github/workflows/hermes-windows-formal-builder.yml"
  pull_request:
    paths:
      - "hermes-connector/src/hermes_connector/bootstrap/windows_formal_runtime.py"
      - "hermes-connector/src/hermes_connector/bootstrap/windows_service.py"
      - "hermes-connector/tests/platform/windows/test_windows_formal_runtime_builder.py"
      - ".github/workflows/hermes-windows-formal-builder.yml"

permissions:
  contents: read

jobs:
  windows-formal-builder:
    name: Explicit Windows formal runtime / windows-latest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Plugin and Connector dependencies
        run: >-
          python -m pip install
          -e hermes-agent-plugin
          -e hermes-connector
          pytest
          pytest-asyncio
          pytest-timeout
          ruff==0.16.1
      - name: Lint explicit formal builder
        run: >-
          ruff check
          hermes-connector/src/hermes_connector/bootstrap/windows_formal_runtime.py
          hermes-connector/src/hermes_connector/bootstrap/windows_service.py
          hermes-connector/tests/platform/windows/test_windows_formal_runtime_builder.py
      - name: Compose explicit formal runtime
        run: >-
          python -m pytest -vv
          --timeout=60 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_windows_formal_runtime_builder.py::test_explicit_windows_formal_runtime_builder_composes
      - name: Verify explicit runtime DB and lock ACLs
        if: always()
        run: >-
          python -m pytest -vv
          --timeout=60 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_windows_formal_runtime_builder.py::test_explicit_windows_runtime_db_and_lock_are_private
