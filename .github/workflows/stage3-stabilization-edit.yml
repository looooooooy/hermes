name: Stage 3 stabilization edit

on:
  push:
    branches:
      - feature/runtime-identity-extension-health
    paths:
      - ".github/stage3-stabilization-edit.trigger"

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-identity-extension-health
      - name: Repair bounded Stage 3 patch-count rule
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("upstream/hermes-core-host-spi-v1/tools/apply_and_verify.py")
          source = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?ms)^        patches = lock\.get\("patches"\)\n'
              r'.*?'
              r'^        for ordinal, entry in enumerate\(patches, start=1\):'
          )
          lines = [
              '        patches = lock.get("patches")',
              '        allowed_patch_counts = {',
              '            1: frozenset({1}),',
              '            2: frozenset({2}),',
              '            3: frozenset({3, 4}),',
              '        }',
              '        if (',
              '            not isinstance(patches, list)',
              '            or len(patches) not in allowed_patch_counts[stage]',
              '        ):',
              '            raise PatchBundleError(',
              '                "bundle patch set does not match stage"',
              '            )',
              '        for ordinal, entry in enumerate(patches, start=1):',
          ]
          updated, count = pattern.subn("\n".join(lines), source)
          if count != 1:
              raise SystemExit(f"validated-stage repair anchor count={count}")
          path.write_text(updated, encoding="utf-8")
          PY
          python -m py_compile upstream/hermes-core-host-spi-v1/tools/apply_and_verify.py
          PYTHONPATH=upstream/hermes-core-host-spi-v1 python - <<'PY'
          from tools.apply_and_verify import PatchBundle, PatchBundleError

          def lock(count):
              return {
                  "stage": 3,
                  "patches": [
                      {"path": f"patches/{index:04d}-x.patch"}
                      for index in range(1, count + 1)
                  ],
              }

          assert PatchBundle._validated_stage(lock(3)) == 3
          assert PatchBundle._validated_stage(lock(4)) == 3
          try:
              PatchBundle._validated_stage(lock(5))
          except PatchBundleError:
              pass
          else:
              raise AssertionError("Stage 3 accepted five patches")
          PY
          git diff --check
          git diff --exit-code --quiet && exit 1 || true
      - name: Commit repaired validator edit
        run: |
          git config user.name "looooooooy"
          git config user.email "105577763+looooooooy@users.noreply.github.com"
          git add upstream/hermes-core-host-spi-v1/tools/apply_and_verify.py
          git commit -m "fix(core): allow locked Stage 3 stabilization patch"
          git push origin HEAD:feature/runtime-identity-extension-health
