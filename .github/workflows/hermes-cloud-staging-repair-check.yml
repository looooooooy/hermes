name: Hermes Cloud staging repair

on:
  push:
    branches: [main]
    paths:
      - "deploy/staging/scripts/repair_and_resume_hermes_cloud_sqlite.sh"
      - "deploy/staging/scripts/diagnose_hermes_cloud_sqlite_seed.sh"
      - "deploy/staging/scripts/diagnose_hermes_cloud_workspace_seed_fields.sh"
      - "deploy/staging/scripts/reconcile_hermes_cloud_workspace_creator_and_resume.sh"
      - "deploy/staging/scripts/reset_hermes_cloud_sqlite_and_resume.sh"
      - "deploy/staging/scripts/attach_hermes_p0_to_existing_nginx.sh"
      - "deploy/staging/scripts/update_hermes_cloud_sqlite_release.sh"
      - "deploy/staging/scripts/repair_pairing_claim_and_resume.sh"
      - ".github/workflows/hermes-cloud-staging-repair-check.yml"
  pull_request:
    paths:
      - "deploy/staging/scripts/repair_and_resume_hermes_cloud_sqlite.sh"
      - "deploy/staging/scripts/diagnose_hermes_cloud_sqlite_seed.sh"
      - "deploy/staging/scripts/diagnose_hermes_cloud_workspace_seed_fields.sh"
      - "deploy/staging/scripts/reconcile_hermes_cloud_workspace_creator_and_resume.sh"
      - "deploy/staging/scripts/reset_hermes_cloud_sqlite_and_resume.sh"
      - "deploy/staging/scripts/attach_hermes_p0_to_existing_nginx.sh"
      - "deploy/staging/scripts/update_hermes_cloud_sqlite_release.sh"
      - "deploy/staging/scripts/repair_pairing_claim_and_resume.sh"
      - ".github/workflows/hermes-cloud-staging-repair-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse repair shell
        run: bash -n deploy/staging/scripts/repair_and_resume_hermes_cloud_sqlite.sh
      - name: Lint repair shell
        run: shellcheck deploy/staging/scripts/repair_and_resume_hermes_cloud_sqlite.sh
      - name: Parse seed diagnostic shell
        run: bash -n deploy/staging/scripts/diagnose_hermes_cloud_sqlite_seed.sh
      - name: Lint seed diagnostic shell
        run: shellcheck deploy/staging/scripts/diagnose_hermes_cloud_sqlite_seed.sh
      - name: Parse workspace seed diagnostic shell
        run: bash -n deploy/staging/scripts/diagnose_hermes_cloud_workspace_seed_fields.sh
      - name: Lint workspace seed diagnostic shell
        run: shellcheck deploy/staging/scripts/diagnose_hermes_cloud_workspace_seed_fields.sh
      - name: Parse workspace creator reconcile shell
        run: bash -n deploy/staging/scripts/reconcile_hermes_cloud_workspace_creator_and_resume.sh
      - name: Lint workspace creator reconcile shell
        run: shellcheck deploy/staging/scripts/reconcile_hermes_cloud_workspace_creator_and_resume.sh
      - name: Parse destructive SQLite reset shell
        run: bash -n deploy/staging/scripts/reset_hermes_cloud_sqlite_and_resume.sh
      - name: Lint destructive SQLite reset shell
        run: shellcheck deploy/staging/scripts/reset_hermes_cloud_sqlite_and_resume.sh
      - name: Parse existing Nginx host attach shell
        run: bash -n deploy/staging/scripts/attach_hermes_p0_to_existing_nginx.sh
      - name: Lint existing Nginx host attach shell
        run: shellcheck deploy/staging/scripts/attach_hermes_p0_to_existing_nginx.sh
      - name: Parse Cloud release update shell
        run: bash -n deploy/staging/scripts/update_hermes_cloud_sqlite_release.sh
      - name: Lint Cloud release update shell
        run: shellcheck deploy/staging/scripts/update_hermes_cloud_sqlite_release.sh
      - name: Parse pairing claim repair shell
        run: bash -n deploy/staging/scripts/repair_pairing_claim_and_resume.sh
      - name: Lint pairing claim repair shell
        run: shellcheck deploy/staging/scripts/repair_pairing_claim_and_resume.sh
