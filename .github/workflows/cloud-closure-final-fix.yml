name: Cloud closure final fix

on:
  push:
    branches:
      - feature/runtime-identity-extension-health
    paths:
      - ".github/cloud-closure-final.trigger"

permissions:
  contents: write

jobs:
  edit-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-identity-extension-health
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded runtime identity and provenance fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: replacement anchor count={count}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          projection = Path(
              "hermes-cloud/src/hermes_cloud/runtime_identity/projection.py"
          )
          source = projection.read_text(encoding="utf-8")
          source = source.replace(
              "from dataclasses import dataclass, field\n",
              "from collections.abc import Mapping\nfrom dataclasses import dataclass, field\n",
              1,
          )
          anchor = "    capabilities: tuple[str, ...] = field(default_factory=tuple)\n\n"
          method = '''    capabilities: tuple[str, ...] = field(default_factory=tuple)\n\n    @classmethod\n    def from_mapping(\n        cls,\n        payload: Mapping[str, object],\n    ) -> RuntimeIdentityProjection:\n        return cls(\n            connector_id=_required_text(payload, \"connector_id\"),\n            runtime_id=_required_text(payload, \"runtime_id\"),\n            runtime_generation=_required_text(payload, \"runtime_generation\"),\n            profile=_required_text(payload, \"profile\"),\n            descriptor_hash=_required_text(payload, \"descriptor_hash\"),\n            extensions=_canonical_text_tuple(payload.get(\"extensions\", ()), \"extensions\"),\n            capabilities=_canonical_text_tuple(\n                payload.get(\"capabilities\", ()),\n                \"capabilities\",\n            ),\n        )\n\n'''
          if source.count(anchor) != 1:
              raise SystemExit("projection method anchor is not unique")
          source = source.replace(anchor, method)
          helpers = '''\n\ndef _required_text(payload: Mapping[str, object], field_name: str) -> str:\n    value = payload.get(field_name)\n    if not isinstance(value, str):\n        raise TypeError(f\"{field_name} must be text\")\n    canonical = value.strip()\n    if not canonical or canonical != value:\n        raise ValueError(f\"{field_name} must be canonical text\")\n    return canonical\n\n\ndef _canonical_text_tuple(value: object, field_name: str) -> tuple[str, ...]:\n    if isinstance(value, str):\n        raise TypeError(f\"{field_name} must be a collection\")\n    try:\n        items = tuple(value)\n    except TypeError as error:\n        raise TypeError(f\"{field_name} must be a collection\") from error\n    if any(\n        not isinstance(item, str) or not item or item != item.strip()\n        for item in items\n    ):\n        raise ValueError(f\"{field_name} must contain canonical text\")\n    if len(items) != len(set(items)):\n        raise ValueError(f\"{field_name} must be unique\")\n    return items\n'''
          if source.rstrip().endswith("}") is False:
              raise SystemExit("projection file ending changed")
          projection.write_text(source.rstrip() + helpers + "\n", encoding="utf-8")

          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/gateway_adapter.py",
              "handshake = RuntimeHandshake.from_mapping(payload)\n        result = self._service.verify_and_register(handshake)\n",
              "handshake = RuntimeHandshake.from_payload(payload)\n        result = self._service.verify_and_register(\n            handshake.as_identity_payload()\n        )\n",
          )

          old_hash = "c824876b75cccba197e4fdef360d1059085503c067549634938d3697befbad1c"
          new_hash = "43e6d54882f246d26b3c2acffcf4594afed9fce9f6f4f459df60827b5a2b47fa"
          replace_one(
              "hermes-cloud/tests/fixtures/hermes_core_host_spi_v1/PROVENANCE.json",
              old_hash,
              new_hash,
          )
          replace_one(
              "hermes-cloud/deploy/test_server/integration-source-lock.json",
              old_hash,
              new_hash,
          )
          PY
          git diff --check
      - name: Verify targeted Cloud closure tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.12.0
          cd hermes-cloud
          uv sync --locked
          uv run --locked ruff check \
            src/hermes_cloud/runtime_identity \
            tests/test_runtime_identity_gateway_adapter.py \
            tests/test_runtime_identity_service.py \
            tests/test_repository_contract_fixture_provenance.py
          uv run --locked pytest -q \
            tests/test_runtime_identity_gateway_adapter.py \
            tests/test_runtime_identity_service.py \
            tests/test_runtime_identity_registry.py \
            tests/test_repository_contract_fixture_provenance.py
      - name: Commit verified final Cloud fix
        run: |
          rm -f \
            .github/workflows/cloud-closure-final-fix.yml \
            .github/cloud-closure-final.trigger
          git diff --check
          git config user.name "looooooooy"
          git config user.email "105577763+looooooooy@users.noreply.github.com"
          git add \
            hermes-cloud/src/hermes_cloud/runtime_identity/projection.py \
            hermes-cloud/src/hermes_cloud/runtime_identity/gateway_adapter.py \
            hermes-cloud/tests/fixtures/hermes_core_host_spi_v1/PROVENANCE.json \
            hermes-cloud/deploy/test_server/integration-source-lock.json \
            .github/workflows/cloud-closure-final-fix.yml \
            .github/cloud-closure-final.trigger
          git commit -m "fix(chain): close Cloud runtime identity contracts"
          git push origin HEAD:feature/runtime-identity-extension-health
