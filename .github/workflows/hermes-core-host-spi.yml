name: Hermes Core Host SPI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "upstream/hermes-core-host-spi-v1/**"
      - "hermes-agent-plugin/src/hermes_agent_plugin/adapters/host/**"
      - "hermes-agent-plugin/tests/integration/host/test_patched_core_distribution.py"
      - ".github/workflows/hermes-core-host-spi.yml"
  pull_request:
    paths:
      - "upstream/hermes-core-host-spi-v1/**"
      - "hermes-agent-plugin/src/hermes_agent_plugin/adapters/host/**"
      - "hermes-agent-plugin/tests/integration/host/test_patched_core_distribution.py"
      - ".github/workflows/hermes-core-host-spi.yml"

permissions:
  contents: read

concurrency:
  group: hermes-core-host-spi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage3-replay:
    name: Stage 3 replay and wheel contract
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ROOT: upstream/hermes-core-host-spi-v1
      UPSTREAM_COMMIT: 14db1a99e21e5523ee61f10f5c3300a5087e8449
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            build==1.3.0 \
            pytest==8.4.2 \
            ruff==0.16.1 \
            uv==0.12.0
          uv --version | grep -E '^uv 0\.12\.0([[:space:]]|$)'
      - name: Lint rebuild and wheel contract gates
        run: |
          python -m ruff check \
            "$BUNDLE_ROOT/tools/rebuild_locked_artifacts.py" \
            "$BUNDLE_ROOT/tests/test_rebuild_locked_artifacts.py" \
            hermes-agent-plugin/tests/integration/host/test_patched_core_distribution.py
      - name: Test artifact rebuild gate
        run: |
          cd "$BUNDLE_ROOT"
          PYTHONPATH=. python -m pytest -q tests/test_rebuild_locked_artifacts.py
      - name: Checkout pinned Hermes Core
        run: |
          upstream="$RUNNER_TEMP/hermes-agent-upstream"
          git init -q "$upstream"
          git -C "$upstream" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$upstream" fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C "$upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          test -z "$(git -C "$upstream" status --porcelain=v1 --untracked-files=all)"
      - name: Create locked Core verification environment
        run: |
          cd "$RUNNER_TEMP/hermes-agent-upstream"
          uv sync \
            --extra all \
            --extra dev \
            --locked \
            --no-install-project
      - name: Rebuild and lock missing Core artifacts
        id: rebuild
        continue-on-error: true
        run: |
          cd "$BUNDLE_ROOT"
          PYTHONPATH=. python -m tools.rebuild_locked_artifacts \
            --source "$RUNNER_TEMP/hermes-agent-upstream"
      - name: Diagnose locked artifact digest mismatch
        if: steps.rebuild.outcome == 'failure'
        run: |
          cd "$BUNDLE_ROOT"
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          from tools.apply_and_verify import PatchBundle
          from tools.rebuild_locked_artifacts import (
              _artifact_specs,
              _build_artifacts,
              _build_configuration,
              _prepare_build_tree,
              _source_specs,
              _validate_source,
              _verify_source_provenance,
          )

          bundle = PatchBundle(Path.cwd())
          source = Path(os.environ["RUNNER_TEMP"]) / "hermes-agent-upstream"
          commit = _validate_source(bundle, source)
          artifacts = _artifact_specs(bundle.lock)
          epoch, command, environment = _build_configuration(bundle.lock)
          patches = bundle._validated_patches()
          sources = _source_specs(
              bundle.lock,
              stage=bundle.stage,
              final_patch_digest=patches[-1].sha256,
          )
          root = Path(tempfile.mkdtemp(prefix="artifact-diagnostic-"))
          try:
              build_root = _prepare_build_tree(
                  bundle,
                  source=source,
                  commit=commit,
                  root=root,
              )
              _verify_source_provenance(build_root, sources)
              generated = _build_artifacts(
                  bundle,
                  build_root=build_root,
                  source_date_epoch=epoch,
                  command=command,
                  environment=environment,
              )
              for artifact in artifacts:
                  path = generated / Path(artifact.relative_path).relative_to("dist")
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  print(
                      json.dumps(
                          {
                              "path": artifact.relative_path,
                              "expected_sha256": artifact.sha256,
                              "actual_sha256": actual,
                              "size": path.stat().st_size,
                          },
                          sort_keys=True,
                      )
                  )
          finally:
              shutil.rmtree(root, ignore_errors=True)
          PY
          exit 1
      - name: Verify bundle tooling and retained artifact contracts
        run: |
          cd "$BUNDLE_ROOT"
          PYTHONPATH=. python -m pytest -q tests
      - name: Apply Stage 3 and run authoritative owner-action gates
        run: |
          workspace="$RUNNER_TEMP/core-replay"
          mkdir -p "$workspace"
          cd "$BUNDLE_ROOT"
          PYTHONPATH=. python -m tools.apply_and_verify \
            --source "$RUNNER_TEMP/hermes-agent-upstream" \
            --workspace-root "$workspace" \
            --target "$workspace/patched" \
            --test-python "$RUNNER_TEMP/hermes-agent-upstream/.venv/bin/python"
      - name: Build Plugin and Connector wheels
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/plugin-dist" hermes-agent-plugin
          python -m build --wheel --outdir "$RUNNER_TEMP/connector-dist" hermes-connector
      - name: Install isolated Core Plugin Connector wheel set
        run: |
          contract_venv="$RUNNER_TEMP/core-plugin-contract"
          python -m venv "$contract_venv"
          "$contract_venv/bin/python" -m pip install --upgrade pip
          "$contract_venv/bin/python" -m pip install --no-deps \
            "$BUNDLE_ROOT"/dist/hermes_agent-0.19.0-py3-none-any.whl \
            "$RUNNER_TEMP"/plugin-dist/hermes_agent_plugin-0.1.0-py3-none-any.whl \
            "$RUNNER_TEMP"/connector-dist/hermes_connector-0.1.0-py3-none-any.whl
          "$contract_venv/bin/python" -m pip install \
            pytest==8.4.2 \
            websockets==15.0.1
      - name: Test real patched Core wheel Host SPI contract
        env:
          HERMES_PATCHED_CORE_DISTRIBUTION: "1"
        run: |
          "$RUNNER_TEMP/core-plugin-contract/bin/python" -m pytest -q \
            hermes-agent-plugin/tests/integration/host/test_patched_core_distribution.py
