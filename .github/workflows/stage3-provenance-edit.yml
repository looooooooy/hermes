name: Stage 3 provenance edit

on:
  push:
    branches:
      - feature/runtime-identity-extension-health
    paths:
      - ".github/stage3-provenance-edit.trigger"

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-identity-extension-health
          fetch-depth: 1
      - name: Lock both stabilization source files
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("upstream/hermes-core-host-spi-v1")
          lock_path = root / "upstream.lock.json"
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          sources = lock["artifact_provenance"]["source_files"]
          by_path = {entry["path"]: entry for entry in sources}
          by_path["hermes_cli/plugins.py"] = {
              "path": "hermes_cli/plugins.py",
              "sha256": "3b7a9d3f839a91d80eb4b24d4347dc1c3d9d39f733cd6ddac18ca263e292b1ed",
          }
          by_path["tools/process_registry.py"] = {
              "path": "tools/process_registry.py",
              "sha256": "c95c3bf1d69378cb790d86b065e55683bca788f98830f0fdffd51a1a7b23c924",
          }
          preferred = [
              "gateway/run.py",
              "hermes_cli/extension_runtime.py",
              "hermes_cli/plugin_store_v1.py",
              "hermes_cli/plugins.py",
              "hermes_cli/web_server.py",
              "tools/process_registry.py",
          ]
          lock["artifact_provenance"]["source_files"] = [
              by_path[path] for path in preferred
          ]
          lock_path.write_text(
              json.dumps(lock, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )

          test_path = root / "tests/test_apply_and_verify.py"
          source = test_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?m)^        "hermes_cli/plugins\.py",\n'
              r'^        "hermes_cli/web_server\.py",\n'
          )
          replacement = (
              '        "hermes_cli/plugins.py",\n'
              '        "hermes_cli/web_server.py",\n'
              '        "tools/process_registry.py",\n'
          )
          updated, count = pattern.subn(replacement, source)
          if count != 1:
              raise SystemExit(f"provenance expectation anchor count={count}")
          test_path.write_text(updated, encoding="utf-8")
          PY
          python -m py_compile \
            upstream/hermes-core-host-spi-v1/tests/test_apply_and_verify.py
          python -m json.tool \
            upstream/hermes-core-host-spi-v1/upstream.lock.json >/dev/null
          git diff --check
      - name: Commit production provenance contract
        run: |
          git config user.name "looooooooy"
          git config user.email "105577763+looooooooy@users.noreply.github.com"
          git rm \
            .github/workflows/stage3-provenance-edit.yml \
            .github/stage3-provenance-edit.trigger
          git add \
            upstream/hermes-core-host-spi-v1/upstream.lock.json \
            upstream/hermes-core-host-spi-v1/tests/test_apply_and_verify.py
          git commit -m "fix(core): lock Stage 3 stabilization source provenance"
          git push origin HEAD:feature/runtime-identity-extension-health
