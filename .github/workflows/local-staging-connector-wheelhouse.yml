name: Local staging Connector wheelhouse

on:
  push:
    branches:
      - tooling/local-staging-wheelhouse-20260807
    paths:
      - ".github/workflows/local-staging-connector-wheelhouse.yml"

permissions:
  contents: read

jobs:
  build-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build Connector wheel and dependency wheelhouse
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build==1.5.0
          mkdir -p "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP/dist"
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" hermes-connector
          python -m pip wheel \
            --wheel-dir "$RUNNER_TEMP/wheelhouse" \
            "$RUNNER_TEMP/dist/hermes_connector-0.1.0-py3-none-any.whl"
          cp "$RUNNER_TEMP/dist/hermes_connector-0.1.0-py3-none-any.whl" "$RUNNER_TEMP/wheelhouse/"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("${RUNNER_TEMP}") / "wheelhouse"
          connector = root / "hermes_connector-0.1.0-py3-none-any.whl"
          assert connector.is_file()
          assert any(path.name.startswith("websockets-15.0.1-") for path in root.iterdir())
          with ZipFile(connector) as archive:
              assert any(name.endswith("METADATA") for name in archive.namelist())
          print("connector offline wheelhouse: ok")
          PY
          (cd "$RUNNER_TEMP/wheelhouse" && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Upload Connector wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: hermes-connector-wheelhouse-171c8cab
          path: ${{ runner.temp }}/wheelhouse
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
