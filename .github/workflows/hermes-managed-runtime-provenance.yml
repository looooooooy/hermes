name: Hermes Managed Runtime Provenance

on:
  push:
    branches:
      - "feature/hermes-release-update-plane-*"
    paths:
      - "hermes-connector/packaging/common/hermes_offline_wheelhouse.py"
      - "hermes-connector/packaging/common/hermes_target_runtime_plan.py"
      - "hermes-connector/packaging/common/hermes_wheelhouse_provenance.py"
      - "hermes-connector/packaging/common/hermes_private_toolchain.py"
      - "hermes-connector/packaging/common/hermes_managed_release.py"
      - "hermes-connector/tests/packaging/test_offline_wheelhouse.py"
      - "hermes-connector/tests/packaging/test_target_runtime_plan.py"
      - "hermes-connector/tests/packaging/test_wheelhouse_provenance.py"
      - "hermes-connector/tests/packaging/test_private_toolchain_runner.py"
      - ".github/workflows/hermes-managed-runtime-provenance.yml"
  pull_request:
    paths:
      - "hermes-connector/packaging/common/hermes_offline_wheelhouse.py"
      - "hermes-connector/packaging/common/hermes_target_runtime_plan.py"
      - "hermes-connector/packaging/common/hermes_wheelhouse_provenance.py"
      - "hermes-connector/packaging/common/hermes_private_toolchain.py"
      - "hermes-connector/packaging/common/hermes_managed_release.py"
      - "hermes-connector/tests/packaging/test_offline_wheelhouse.py"
      - "hermes-connector/tests/packaging/test_target_runtime_plan.py"
      - "hermes-connector/tests/packaging/test_wheelhouse_provenance.py"
      - "hermes-connector/tests/packaging/test_private_toolchain_runner.py"
      - ".github/workflows/hermes-managed-runtime-provenance.yml"

permissions:
  contents: read

concurrency:
  group: hermes-managed-runtime-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Runtime provenance / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify wheelhouse, target plan, PEP 610 and Private uv contracts
        run: >-
          python -m pytest -q
          hermes-connector/tests/packaging/test_offline_wheelhouse.py
          hermes-connector/tests/packaging/test_target_runtime_plan.py
          hermes-connector/tests/packaging/test_wheelhouse_provenance.py
          hermes-connector/tests/packaging/test_private_toolchain_runner.py
