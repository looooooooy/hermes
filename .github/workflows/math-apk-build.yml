name: Build Math APK v3

on:
  push:
    branches:
      - ci/math-apk-v3-20260809

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore v2 base project
        shell: bash
        run: |
          cat .ci-temp/math-apk/project.b64.part* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/math.zip
          unzip -q /tmp/math.zip -d .
          test -f grade2-math-android/app/build.gradle

      - name: Apply v3 UI refactor patch
        shell: bash
        run: |
          cat .ci-temp/math-apk-v3/patch.b64.part* > /tmp/v3patch.b64
          base64 -d /tmp/v3patch.b64 > /tmp/v3.patch.bz2
          bzip2 -dc /tmp/v3.patch.bz2 > /tmp/v3.patch
          patch -p1 < /tmp/v3.patch
          grep -q "versionName '3.0.0'" grade2-math-android/app/build.gradle
          grep -q "APP_VERSION = '3.0'" grade2-math-android/app/src/main/assets/www/app.js

      - name: Build debug APK
        shell: bash
        run: gradle -p grade2-math-android --no-daemon assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          cp grade2-math-android/app/build/outputs/apk/debug/app-debug.apk mathplanet-grade2-v3.0.0.apk
          sha256sum mathplanet-grade2-v3.0.0.apk > mathplanet-grade2-v3.0.0.apk.sha256
          ls -lh mathplanet-grade2-v3.0.0.apk
          cat mathplanet-grade2-v3.0.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mathplanet-grade2-v3-apk
          path: |
            mathplanet-grade2-v3.0.0.apk
            mathplanet-grade2-v3.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 1
