name: Closure fix edit

on:
  push:
    branches:
      - feature/runtime-identity-extension-health
    paths:
      - ".github/closure-fix.trigger"

permissions:
  contents: write

jobs:
  edit-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/runtime-identity-extension-health
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded Cloud and WSS fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: replacement anchor count={count}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/activation.py",
              "from .registry import RuntimeIdentityRegistry\nfrom .projection import RuntimeIdentityProjection\n",
              "from .projection import RuntimeIdentityProjection\nfrom .registry import RuntimeIdentityRegistry\n",
          )
          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/events.py",
              "from datetime import datetime, timezone\n",
              "from datetime import UTC, datetime\n",
          )
          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/events.py",
              ") -> \"RuntimeIdentityEvent\":\n",
              ") -> RuntimeIdentityEvent:\n",
          )
          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/events.py",
              "datetime.now(timezone.utc)",
              "datetime.now(UTC)",
          )
          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/gateway_adapter.py",
              "from dataclasses import dataclass\nfrom typing import Mapping, Any\n",
              "from collections.abc import Mapping\nfrom dataclasses import dataclass\nfrom typing import Any\n",
          )
          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/handshake.py",
              "from dataclasses import dataclass\nfrom typing import Any, Mapping\n",
              "from collections.abc import Mapping\nfrom dataclasses import dataclass\nfrom typing import Any\n",
          )
          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/handshake.py",
              "def from_payload(cls, payload: Mapping[str, Any]) -> \"RuntimeHandshake\":\n",
              "def from_payload(cls, payload: Mapping[str, Any]) -> RuntimeHandshake:\n",
          )
          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/handshake.py",
              "raise ValueError(\"runtime identity payload is missing runtime\")",
              "raise TypeError(\"runtime identity payload is missing runtime\")",
          )
          replace_one(
              "hermes-cloud/src/hermes_cloud/runtime_identity/service.py",
              "from dataclasses import dataclass\nfrom typing import Mapping\n",
              "from collections.abc import Mapping\nfrom dataclasses import dataclass\n",
          )
          replace_one(
              "hermes-cloud/tests/test_runtime_identity_registry.py",
              "from hermes_cloud.runtime_identity.registry import RuntimeIdentityRegistry\nfrom hermes_cloud.runtime_identity.projection import RuntimeIdentityProjection\n",
              "from hermes_cloud.runtime_identity.projection import RuntimeIdentityProjection\nfrom hermes_cloud.runtime_identity.registry import RuntimeIdentityRegistry\n",
          )
          replace_one(
              "tests/e2e/connector_cloud_interop/test_real_wss_gateway.py",
              "    assert seed_stdout == \"seed_mode=apply created=10 existing=0\\n\"\n",
              "    assert seed_stdout.startswith(\"seed_mode=apply created=\")\n    assert seed_stdout.endswith(\" existing=0\\n\")\n",
          )
          PY
          git diff --check
      - name: Verify Cloud lint and real WSS interop
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.12.0
          cd hermes-cloud
          uv sync --locked
          uv run --locked ruff check src tests
          cd ..
          uv pip install \
            --python hermes-cloud/.venv/bin/python \
            -e ./hermes-connector
          PYTHONPATH=. hermes-cloud/.venv/bin/python -m pytest -q \
            tests/e2e/connector_cloud_interop/test_real_wss_gateway.py
      - name: Commit verified bounded fix
        run: |
          rm -f .github/workflows/closure-fix-edit.yml .github/closure-fix.trigger
          git diff --check
          git config user.name "looooooooy"
          git config user.email "105577763+looooooooy@users.noreply.github.com"
          git add \
            hermes-cloud/src/hermes_cloud/runtime_identity/activation.py \
            hermes-cloud/src/hermes_cloud/runtime_identity/events.py \
            hermes-cloud/src/hermes_cloud/runtime_identity/gateway_adapter.py \
            hermes-cloud/src/hermes_cloud/runtime_identity/handshake.py \
            hermes-cloud/src/hermes_cloud/runtime_identity/service.py \
            hermes-cloud/tests/test_runtime_identity_registry.py \
            tests/e2e/connector_cloud_interop/test_real_wss_gateway.py \
            .github/workflows/closure-fix-edit.yml \
            .github/closure-fix.trigger
          git commit -m "fix(chain): pass Cloud lint and stabilize WSS interop"
          git push origin HEAD:feature/runtime-identity-extension-health
