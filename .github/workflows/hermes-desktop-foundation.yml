name: Hermes Desktop foundation

on:
  push:
    branches:
      - "feature/hermes-desktop-foundation-*"
    paths:
      - "hermes-desktop/**"
      - "hermes-runtime-manager/**"
      - "hermes-connector/packaging/common/hermes_private_toolchain.py"
      - "hermes-connector/packaging/common/hermes_managed_release.py"
      - "hermes-connector/packaging/common/hermes_offline_wheelhouse.py"
      - "hermes-connector/tests/packaging/test_private_toolchain_runner.py"
      - "hermes-connector/tests/packaging/test_managed_release_entrypoint.py"
      - "hermes-connector/tests/packaging/test_offline_wheelhouse.py"
      - ".github/workflows/hermes-desktop-foundation.yml"
  pull_request:
    paths:
      - "hermes-desktop/**"
      - "hermes-runtime-manager/**"
      - "hermes-connector/packaging/common/hermes_private_toolchain.py"
      - "hermes-connector/packaging/common/hermes_managed_release.py"
      - "hermes-connector/packaging/common/hermes_offline_wheelhouse.py"
      - "hermes-connector/tests/packaging/test_private_toolchain_runner.py"
      - "hermes-connector/tests/packaging/test_managed_release_entrypoint.py"
      - "hermes-connector/tests/packaging/test_offline_wheelhouse.py"
      - ".github/workflows/hermes-desktop-foundation.yml"

permissions:
  contents: read

concurrency:
  group: hermes-desktop-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Svelte desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: hermes-desktop
        run: npm install --no-audit --no-fund
      - name: Static check
        working-directory: hermes-desktop
        run: npm run check
      - name: Build frontend
        working-directory: hermes-desktop
        run: npm run build

  private-toolchain:
    name: Private Python/uv execution contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Prove private toolchain, wheelhouse and managed release composition
        run: >-
          python -m pytest -q
          hermes-connector/tests/packaging/test_private_toolchain_runner.py
          hermes-connector/tests/packaging/test_offline_wheelhouse.py
          hermes-connector/tests/packaging/test_managed_release_entrypoint.py

  native-toolchain:
    name: Real private toolchain / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Use stable Rust
        run: rustup default stable
      - name: Build unqualified Hermes toolchain bundle from pinned upstream assets
        run: >-
          python hermes-runtime-manager/toolchains/build_toolchain_bundle.py
          --lock hermes-runtime-manager/toolchains/upstream-lock-v1.json
          --target ${{ matrix.target }}
          --output "${{ runner.temp }}/hermes-toolchain-unqualified"
      - name: Qualify source and license evidence before publication
        run: >-
          python hermes-runtime-manager/toolchains/qualify_toolchain_bundle.py
          --bundle "${{ runner.temp }}/hermes-toolchain-unqualified"
          --license-lock hermes-runtime-manager/toolchains/license-source-lock-v1.json
          --output "${{ runner.temp }}/hermes-toolchain-qualified"
      - name: Install only the qualified bundle with the customer-side Runtime Manager
        run: >-
          cargo run --quiet --manifest-path hermes-runtime-manager/Cargo.toml --
          install-toolchain
          "${{ runner.temp }}/hermes-toolchain-qualified"
          "${{ runner.temp }}/hermes-toolchains"
      - name: Execute installed private Python and uv
        run: >-
          python hermes-runtime-manager/toolchains/verify_installed_toolchain.py
          --toolchains-root "${{ runner.temp }}/hermes-toolchains"
          --python-version 3.13.14
          --uv-version 0.12.2

  runtime-manager:
    name: Runtime Manager / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use stable Rust
        run: rustup default stable
      - name: Test shared lifecycle core and local IPC
        run: cargo test --manifest-path hermes-runtime-manager/Cargo.toml --all-targets
      - name: Check status CLI
        run: cargo run --quiet --manifest-path hermes-runtime-manager/Cargo.toml -- status

  tauri-shell:
    name: Tauri native shell / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Use stable Rust
        run: rustup default stable
      - name: Install frontend dependencies
        working-directory: hermes-desktop
        run: npm install --no-audit --no-fund
      - name: Check native shell
        run: cargo check --manifest-path hermes-desktop/src-tauri/Cargo.toml
      - name: Test native Desktop to Runtime Manager contract
        run: cargo test --manifest-path hermes-desktop/src-tauri/Cargo.toml --lib
