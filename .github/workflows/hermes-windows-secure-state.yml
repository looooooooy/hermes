name: Hermes Windows Secure State

on:
  push:
    branches:
      - "feature/hermes-windows-formal-runtime-*"
    paths:
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/private_state.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/dpapi_secret_store.py"
      - "hermes-connector/tests/platform/windows/test_secure_state_foundation.py"
      - "hermes-connector/tests/platform/test_platform_boundaries.py"
      - ".github/workflows/hermes-windows-secure-state.yml"
  pull_request:
    paths:
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/private_state.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/dpapi_secret_store.py"
      - "hermes-connector/tests/platform/windows/test_secure_state_foundation.py"
      - "hermes-connector/tests/platform/test_platform_boundaries.py"
      - ".github/workflows/hermes-windows-secure-state.yml"

permissions:
  contents: read

concurrency:
  group: hermes-windows-secure-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Windows secure state contract / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          -e hermes-connector
          pytest
          pytest-asyncio
          ruff==0.16.1
      - name: Lint Windows secure state slice
        run: >-
          ruff check
          hermes-connector/src/hermes_connector/adapters/platform/windows/private_state.py
          hermes-connector/src/hermes_connector/adapters/platform/windows/dpapi_secret_store.py
          hermes-connector/tests/platform/windows/test_secure_state_foundation.py
      - name: Preserve Connector platform boundary
        run: >-
          python -m pytest -vv
          hermes-connector/tests/platform/test_platform_boundaries.py

  windows-secure-state:
    name: Current-user ACL + DPAPI / windows-latest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: >-
          python -m pip install
          -e hermes-connector
          pytest
          pytest-asyncio
          pytest-timeout
      - name: Test private ACL, DPAPI, CAS, and concurrency
        run: >-
          python -m pytest -vv
          --timeout=45 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_secure_state_foundation.py
