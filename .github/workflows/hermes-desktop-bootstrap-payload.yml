name: Hermes Desktop bootstrap payload

on:
  push:
    branches:
      - "main"
      - "feature/hermes-desktop-foundation-*"
      - "feature/hermes-release-update-plane-*"
    paths:
      - "hermes-desktop/bootstrap/**"
      - "hermes-desktop/managed-release/install_managed_release_payload.py"
      - "hermes-desktop/managed-release/build_managed_release_installer_zipapp.py"
      - "hermes-connector/src/**"
      - "hermes-connector/pyproject.toml"
      - "hermes-connector/uv.lock"
      - "hermes-connector/packaging/common/hermes_local_release.py"
      - "hermes-connector/packaging/common/hermes_managed_release.py"
      - "hermes-connector/packaging/common/hermes_offline_wheelhouse.py"
      - "hermes-connector/packaging/common/hermes_private_toolchain.py"
      - "hermes-desktop/src-tauri/**"
      - "hermes-runtime-manager/**"
      - ".github/workflows/hermes-desktop-bootstrap-payload.yml"
  pull_request:
    paths:
      - "hermes-desktop/bootstrap/**"
      - "hermes-desktop/managed-release/install_managed_release_payload.py"
      - "hermes-desktop/managed-release/build_managed_release_installer_zipapp.py"
      - "hermes-connector/src/**"
      - "hermes-connector/pyproject.toml"
      - "hermes-connector/uv.lock"
      - "hermes-connector/packaging/common/hermes_local_release.py"
      - "hermes-connector/packaging/common/hermes_managed_release.py"
      - "hermes-connector/packaging/common/hermes_offline_wheelhouse.py"
      - "hermes-connector/packaging/common/hermes_private_toolchain.py"
      - "hermes-desktop/src-tauri/**"
      - "hermes-runtime-manager/**"
      - ".github/workflows/hermes-desktop-bootstrap-payload.yml"

permissions:
  contents: read

concurrency:
  group: hermes-desktop-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-payload:
    name: Bootstrap payload / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            desktop_binary: hermes-desktop/src-tauri/target/release/hermes-desktop
            runtime_manager: hermes-runtime-manager/target/release/hermes-runtime-manager
            private_uv: uv/uv
          - os: macos-latest
            target: macos-aarch64
            desktop_binary: hermes-desktop/src-tauri/target/release/hermes-desktop
            runtime_manager: hermes-runtime-manager/target/release/hermes-runtime-manager
            private_uv: uv/uv
          - os: windows-latest
            target: windows-x86_64
            desktop_binary: hermes-desktop/src-tauri/target/release/hermes-desktop.exe
            runtime_manager: hermes-runtime-manager/target/release/hermes-runtime-manager.exe
            private_uv: uv/uv.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux Desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Use stable Rust
        run: rustup default stable
      - name: Install Desktop frontend dependencies
        working-directory: hermes-desktop
        run: npm install --no-audit --no-fund
      - name: Build Desktop frontend
        working-directory: hermes-desktop
        run: npm run build
      - name: Build Hermes Desktop release binary
        run: >-
          cargo build --release
          --manifest-path hermes-desktop/src-tauri/Cargo.toml
          --bin hermes-desktop
      - name: Build standalone Runtime Manager release binary
        run: >-
          cargo build --release
          --manifest-path hermes-runtime-manager/Cargo.toml
          --bin hermes-runtime-manager
      - name: Build trusted local Managed Release installer zipapp
        run: >-
          python hermes-desktop/managed-release/build_managed_release_installer_zipapp.py
          --output "${{ runner.temp }}/hermes-managed-release-installer.pyz"
      - name: Build unqualified Private Toolchain
        run: >-
          python hermes-runtime-manager/toolchains/build_toolchain_bundle.py
          --lock hermes-runtime-manager/toolchains/upstream-lock-v1.json
          --target ${{ matrix.target }}
          --output "${{ runner.temp }}/hermes-toolchain-unqualified"
      - name: Qualify Private Toolchain source and license evidence
        run: >-
          python hermes-runtime-manager/toolchains/qualify_toolchain_bundle.py
          --bundle "${{ runner.temp }}/hermes-toolchain-unqualified"
          --license-lock hermes-runtime-manager/toolchains/license-source-lock-v1.json
          --output "${{ runner.temp }}/hermes-toolchain-qualified"
      - name: Build pairing-only Bootstrap artifact
        if: runner.os != 'Linux'
        run: >-
          python hermes-desktop/bootstrap/build_pairing_bootstrap.py
          --target ${{ matrix.target }}
          --uv "${{ runner.temp }}/hermes-toolchain-qualified/${{ matrix.private_uv }}"
          --connector-project "${{ github.workspace }}/hermes-connector"
          --output "${{ runner.temp }}/hermes-pairing-bootstrap"
      - name: Assemble Desktop bootstrap qualification payload
        run: >-
          python hermes-desktop/bootstrap/assemble_bootstrap_payload.py
          --target ${{ matrix.target }}
          --desktop-version 0.1.0
          --desktop-binary "${{ matrix.desktop_binary }}"
          --runtime-manager "${{ matrix.runtime_manager }}"
          --qualified-toolchain "${{ runner.temp }}/hermes-toolchain-qualified"
          --output "${{ runner.temp }}/hermes-bootstrap-payload"
      - name: Bind trusted local update installer into Bootstrap manifest
        run: >-
          python hermes-desktop/bootstrap/augment_bootstrap_with_update_installer.py
          --payload "${{ runner.temp }}/hermes-bootstrap-payload"
          --installer "${{ runner.temp }}/hermes-managed-release-installer.pyz"
      - name: Bind pairing-only helper into Bootstrap manifest
        if: runner.os != 'Linux'
        run: >-
          python hermes-desktop/bootstrap/augment_bootstrap_with_pairing.py
          --payload "${{ runner.temp }}/hermes-bootstrap-payload"
          --pairing "${{ runner.temp }}/hermes-pairing-bootstrap"
      - name: Verify payload with poisoned host PATH
        run: >-
          python hermes-desktop/bootstrap/validate_bootstrap_payload.py
          --payload "${{ runner.temp }}/hermes-bootstrap-payload"
          --expected-target ${{ matrix.target }}
      - name: Upload unsigned qualification payload
        uses: actions/upload-artifact@v4
        with:
          name: hermes-bootstrap-qualification-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/hermes-bootstrap-payload
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
