name: Plugin connector control

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "hermes-agent-plugin/**"
      - "hermes-connector/**"
      - "tests/e2e/plugin_test_runtime.py"
      - "tests/e2e/test_plugin_connector_owner_control.py"
      - "tests/e2e/test_plugin_connector_owner_action_flow.py"
      - ".github/workflows/plugin-connector-control.yml"
  pull_request:
    paths:
      - "hermes-agent-plugin/**"
      - "hermes-connector/**"
      - "tests/e2e/plugin_test_runtime.py"
      - "tests/e2e/test_plugin_connector_owner_control.py"
      - "tests/e2e/test_plugin_connector_owner_action_flow.py"
      - ".github/workflows/plugin-connector-control.yml"

permissions:
  contents: read

concurrency:
  group: plugin-connector-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-control-e2e:
    name: macOS owner-control E2E
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Plugin and Connector
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e ./hermes-agent-plugin \
            -e ./hermes-connector \
            pytest==8.4.2 \
            pytest-asyncio==1.1.0 \
            ruff==0.16.1
      - name: Lint new integration test
        run: python -m ruff check tests/e2e/test_plugin_connector_owner_action_flow.py
      - name: Test real Plugin Connector control path
        run: |
          python -m pytest -q \
            tests/e2e/test_plugin_connector_owner_control.py \
            tests/e2e/test_plugin_connector_owner_action_flow.py
