name: Hermes Windows Formal Composition

on:
  push:
    branches:
      - "feature/hermes-windows-formal-composition-*"
    paths:
      - "hermes-connector/src/hermes_connector/bootstrap/runtime.py"
      - "hermes-connector/src/hermes_connector/bootstrap/windows.py"
      - "hermes-connector/tests/platform/windows/test_formal_composition.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/**"
      - ".github/workflows/hermes-windows-formal-composition.yml"
  pull_request:
    paths:
      - "hermes-connector/src/hermes_connector/bootstrap/runtime.py"
      - "hermes-connector/src/hermes_connector/bootstrap/windows.py"
      - "hermes-connector/tests/platform/windows/test_formal_composition.py"
      - "hermes-connector/src/hermes_connector/adapters/platform/windows/**"
      - ".github/workflows/hermes-windows-formal-composition.yml"

permissions:
  contents: read

concurrency:
  group: hermes-windows-formal-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Formal composition contract / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: >-
          python -m pip install
          -e hermes-connector
          pytest
          pytest-asyncio
          ruff==0.16.1
      - name: Lint formal composition slice
        run: >-
          ruff check
          hermes-connector/src/hermes_connector/bootstrap/runtime.py
          hermes-connector/src/hermes_connector/bootstrap/windows.py
          hermes-connector/tests/platform/windows/test_formal_composition.py
      - name: Regress platform-neutral service runner
        run: >-
          python -m pytest -vv
          hermes-connector/tests/test_service_runner.py
          hermes-connector/tests/platform/test_platform_boundaries.py

  windows-composition:
    name: Windows formal runtime composition / windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Plugin and Connector dependencies
        run: >-
          python -m pip install
          -e hermes-agent-plugin
          -e hermes-connector
          pytest
          pytest-asyncio
          pytest-timeout
      - name: Regress verified Windows runtime adapters
        run: >-
          python -m pytest -vv
          --timeout=45 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_secure_state_foundation.py
          hermes-connector/tests/platform/windows/test_device_identity_dpapi.py
          hermes-connector/tests/platform/windows/test_state_projections.py
          hermes-connector/tests/platform/windows/test_status_receipt.py
          hermes-connector/tests/platform/windows/test_runtime_adapter_parity.py
      - name: Test formal Windows runtime composition and ACLs
        run: >-
          python -m pytest -vv
          --timeout=60 --timeout-method=thread
          hermes-connector/tests/platform/windows/test_formal_composition.py
