name: Hermes Windows Install Foundation

on:
  push:
    branches:
      - "feature/hermes-windows-install-activation-*"
    paths:
      - "hermes-connector/packaging/windows/**"
      - "hermes-connector/tests/packaging/test_windows_task_contract.py"
      - "hermes-connector/tests/packaging/test_windows_task_smoke.py"
      - ".github/workflows/hermes-windows-install-foundation.yml"
  pull_request:
    paths:
      - "hermes-connector/packaging/windows/**"
      - "hermes-connector/tests/packaging/test_windows_task_contract.py"
      - "hermes-connector/tests/packaging/test_windows_task_smoke.py"
      - ".github/workflows/hermes-windows-install-foundation.yml"

permissions:
  contents: read

concurrency:
  group: hermes-windows-install-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-contract:
    name: Windows task contract / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest ruff==0.16.1
      - name: Lint Windows packaging slice
        run: >-
          ruff check
          hermes-connector/packaging/windows/hermes_windows_tasks.py
          hermes-connector/packaging/windows/hermes_connector_entry.py
          hermes-connector/tests/packaging/test_windows_task_contract.py
          hermes-connector/tests/packaging/test_windows_task_smoke.py
      - name: Verify exact-release Scheduled Task contract
        run: >-
          python -m pytest -vv
          hermes-connector/tests/packaging/test_windows_task_contract.py

  scheduled-task-smoke:
    name: Real per-user Scheduled Task / windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Create, inspect, and delete real Scheduled Task
        run: >-
          python -m pytest -vv
          hermes-connector/tests/packaging/test_windows_task_smoke.py

  self-contained-exe:
    name: Self-contained Connector EXE / windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Connector and freezer
        run: >-
          python -m pip install
          -e hermes-connector
          "pyinstaller>=6.10,<7"
      - name: Build one-file Connector executable
        run: >-
          pyinstaller
          --clean
          --noconfirm
          --onefile
          --name hermes-connector
          --collect-all alembic
          --collect-all cryptography
          --collect-all sqlalchemy
          hermes-connector/packaging/windows/hermes_connector_entry.py
      - name: Execute frozen Connector without Python CLI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\hermes-connector.exe"
          if (-not (Test-Path $exe)) { throw "frozen connector missing" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "frozen --help failed" }
          $env:HERMES_CONNECTOR_CLOUD_ENDPOINT = "wss://cloud.example.test/connector/ws"
          $env:HERMES_CONNECTOR_API_ENDPOINT = "https://cloud.example.test/hermes"
          $env:HERMES_CONNECTOR_PROFILE = "default"
          $env:HERMES_CONNECTOR_VERSION = "1.2.3"
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP "hermes-frozen-home"
          $stdout = Join-Path $env:RUNNER_TEMP "hermes-frozen-status.out"
          $process = Start-Process -FilePath $exe -ArgumentList @("status", "--json") -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout
          $status = (Get-Content -Raw $stdout).Trim()
          if ($process.ExitCode -ne 3) { throw "expected not-ready exit code 3, got $($process.ExitCode)" }
          if ($status -ne '{"ready":false}') { throw "unexpected frozen status: $status" }
