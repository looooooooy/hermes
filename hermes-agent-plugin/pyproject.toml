[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-plugin"
version = "0.1.0"
description = "Hermes Agent extension for observer and explicit-control connections"
readme = { text = "Hermes Agent Plugin provides observer and explicit-control integration for Hermes Agent.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Hermes contributors" }]
dependencies = [
  "websockets>=13,<17",
]

[project.optional-dependencies]
hermes-019-contract-test = [
  "hermes-agent==0.19.0",
]

[project.entry-points."hermes_agent.plugins"]
hermes-agent-plugin = "hermes_agent_plugin"

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5.0",
  "pytest>=8.4,<9.0",
  "ruff==0.16.1",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "packaging"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/integration/host/test_real_hermes_019_contract.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = [
  "src/hermes_agent_plugin",
]

[tool.hatch.build.targets.sdist]
include = [
  "/packaging",
  "/src",
  "/plugin.yaml",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
